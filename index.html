<title>BASERA • Digital Menu</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f6f1e8;
    color:#2d241d;
    font-family:'Poppins',sans-serif;
}

/* HEADER */

header{
    background:#201912;
    color:#f7ead5;
    text-align:center;
    padding:45px 20px 35px;
}

.logo{
    font-family:'Playfair Display',serif;
    font-size:42px;
    letter-spacing:5px;
}

.tagline{
    margin-top:8px;
    font-size:12px;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:.8;
}

/* SEARCH */

.search-box{
    max-width:600px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px 20px;
    border:1px solid #c9bba7;
    border-radius:30px;
    background:#fffdf9;
    outline:none;
    font-size:14px;
}

/* CATEGORY */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:10px 20px 20px;
    max-width:1100px;
    margin:auto;
}

.categories::-webkit-scrollbar{
    height:4px;
}

.categories button{
    white-space:nowrap;
    padding:10px 20px;
    border-radius:25px;
    border:1px solid #b49b7c;
    background:transparent;
    color:#4b3828;
    cursor:pointer;
    transition:.3s;
}

.categories button:hover,
.categories button.active{
    background:#302217;
    color:white;
}

/* MENU */

.menu{
    max-width:1100px;
    margin:10px auto 100px;
    padding:0 20px;
}

.section-title{
    font-family:'Playfair Display',serif;
    font-size:30px;
    margin:35px 0 18px;
    border-bottom:1px solid #cdbfae;
    padding-bottom:10px;
}

.items{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.item{
    background:#fffdf9;
    border:1px solid #e3d8c8;
    padding:22px;
    border-radius:8px;
    transition:.3s;
}

.item:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.item-name{
    font-family:'Playfair Display',serif;
    font-size:20px;
}

.price{
    font-weight:600;
    white-space:nowrap;
}

.description{
    font-size:12px;
    color:#766b60;
    margin:8px 0 15px;
    line-height:1.6;
}

.add-btn{
    width:100%;
    padding:10px;
    border:1px solid #39291d;
    background:transparent;
    color:#39291d;
    border-radius:5px;
    cursor:pointer;
    transition:.3s;
}

.add-btn:hover{
    background:#39291d;
    color:white;
}

/* ORDER BAR */

.order-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#201912;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
    box-shadow:0 -5px 20px rgba(0,0,0,.15);
    z-index:50;
}

.order-btn{
    background:#e5c79d;
    border:none;
    padding:11px 25px;
    border-radius:25px;
    cursor:pointer;
    font-weight:600;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
    z-index:100;
}

.modal-content{
    background:#fffdf9;
    width:90%;
    max-width:450px;
    padding:30px;
    border-radius:10px;
    max-height:80vh;
    overflow:auto;
}

.modal-title{
    font-family:'Playfair Display',serif;
    font-size:28px;
    margin-bottom:20px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid #ddd;
    padding:12px 0;
    font-size:14px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:22px;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-top:20px;
    display:flex;
    justify-content:space-between;
}

.place-order{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#241b14;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* FOOTER */

footer{
    text-align:center;
    padding:35px 20px 90px;
    color:#776b5e;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:32px;
    }

    .section-title{
        font-size:26px;
    }

    .items{
        grid-template-columns:1fr;
    }

    .order-bar{
        justify-content:space-between;
        gap:10px;
    }

}

</style>
</head>
