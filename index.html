const cats = [

/* ==========================================
   NAVIGATION
========================================== */

function nav(){

    document.getElementById("nav").innerHTML =
        cats.map(c => `

            <button
                class="${c === cat ? "active" : ""}"
                onclick="cat=${JSON.stringify(c)};nav();render()"
            >
                ${c}
            </button>

        `).join("");

}


/* ==========================================
   DISPLAY MENU
========================================== */

function render(){

    const q =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filtered = data.filter(x =>

        (cat === "All" || x[0] === cat) &&

        (
            x[1].toLowerCase().includes(q) ||
            x[2].toLowerCase().includes(q)
        )

    );


    if(filtered.length === 0){

        document.getElementById("menu").innerHTML = `

            <div class="empty">

                No items found.<br>

                Try another search.

            </div>

        `;

        return;

    }


    document.getElementById("menu").innerHTML = `

        <h2>
            ${cat === "All" ? "Our Menu" : cat}
        </h2>

        <div class="count">

            ${filtered.length}
            item${filtered.length === 1 ? "" : "s"}

        </div>

        <div class="grid">

            ${filtered.map((x,i) => `

                <div class="item">

                    <div class="info">

                        <div class="name">

                            ${x[1]}

                            <span class="veg">
                                VEG
                            </span>

                        </div>

                        <div class="desc">
                            ${x[2]}
                        </div>

                        <div class="price">
                            ₹${x[3]}
                        </div>

                    </div>


                    <button
                        class="add"
                        onclick="add(${i},${JSON.stringify(x[1])},${x[3]})"
                    >
                        ADD
                    </button>

                </div>

            `).join("")}

        </div>

    `;

}

    document.getElementById("cart").textContent =

}


/* ==========================================
   SHOW CART
========================================== */

function showCart(){

    if(!cart.length){

        alert("Your cart is empty.");

        return;

    }


    const total =
        cart.reduce(
            (sum,item) => sum + item[1],
            0
        );


    const order =
        cart.map((item,index) =>

            `${index + 1}. ${item[0]} - ₹${item[1]}`

        ).join("\n");


    const message = `Hello BASERA! 👋

I would like to place an order:

${order}

Total: ₹${total}

Please confirm my order. Thank you!`;


    if(
        confirm(
          order +

"\n\nTotal: ₹" +

total +

"\n\nSend this order on WhatsApp?"

)

){

window.open(

"https://wa.me/" +

WHATSAPP +

"?text=" +

encodeURIComponent (message),

" blank"

);

nav();

render();
