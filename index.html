<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASERA • Digital Menu</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f0f0f;
color:#fff
}

header{
padding:30px 18px 20px;
text-align:center;
background:linear-gradient(145deg,#191919,#0b0b0b)
}

.logo{
font-size:38px;
font-weight:900;
letter-spacing:4px
}

.tag{
color:#aaa;
margin:8px 0 20px;
font-size:14px
}

.search{
width:100%;
max-width:560px;
padding:14px 16px;
border:1px solid #333;
border-radius:14px;
background:#191919;
color:#fff;
font-size:16px;
outline:none
}

.search:focus{
border-color:#e63946
}

nav{
position:sticky;
top:0;
z-index:5;
display:flex;
gap:8px;
overflow:auto;
padding:12px;
background:#101010;
border-bottom:1px solid #222
}

nav button{
white-space:nowrap;
border:1px solid #333;
background:#191919;
color:#ddd;
padding:10px 15px;
border-radius:20px;
cursor:pointer
}

nav button.active{
background:#e63946;
color:#fff;
border-color:#e63946
}

main{
max-width:850px;
margin:auto;
padding:18px
}

h2{
margin:20px 0 12px
}

.count{
color:#888;
font-size:13px;
margin-bottom:12px
}

.grid{
display:grid;
gap:12px
}

.item{
display:flex;
justify-content:space-between;
gap:14px;
padding:15px;
background:#181818;
border:1px solid #292929;
border-radius:16px
}

.info{
flex:1;
min-width:0
}

.name{
font-size:18px;
font-weight:700
}

.desc{
font-size:13px;
color:#999;
margin:6px 0;
line-height:1.45
}

.price{
font-weight:800;
font-size:16px
}

.veg{
font-size:10px;
border:1px solid #319b54;
color:#61d184;
padding:2px 6px;
border-radius:8px;
margin-left:6px
}

.add{
align-self:center;
border:0;
background:#e63946;
color:#fff;
padding:9px 14px;
border-radius:10px;
font-weight:bold;
cursor:pointer
}

.add:active{
transform:scale(.95)
}

#cart{
position:fixed;
right:16px;
bottom:18px;
z-index:10;
background:#e63946;
color:#fff;
border:0;
padding:14px 18px;
border-radius:30px;
font-weight:bold;
box-shadow:0 8px 25px #000;
cursor:pointer
}

.whatsapp{
display:block;
width:calc(100% - 36px);
max-width:814px;
margin:10px auto 25px;
padding:15px;
text-align:center;
background:#25D366;
color:white;
text-decoration:none;
border-radius:14px;
font-weight:bold;
font-size:16px
}

footer{
text-align:center;
color:#777;
padding:35px;
line-height:1.6
}

.empty{
text-align:center;
color:#888;
padding:40px 10px
}
</style>
</head>

<body>

<header>

<div class="logo">BASERA</div>

<div class="tag">
Eat • Talk • Enjoy
</
